name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  focused-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: EuclidPolishEnv
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true

      - name: Compile Python sources
        run: python -m compileall -q euclid_polish scripts tests

      - name: Lint
        run: ruff check .

      - name: Run full test suite
        env:
          EUCLID_POLISH_DISABLE_AUTO_SSH: "1"
          NUMBA_DISABLE_JIT: "1"
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

      - name: Run focused hardening regressions
        env:
          NUMBA_DISABLE_JIT: "1"
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest --noconftest tests/test_web_security.py -q
          python -m pytest --noconftest tests/test_jobs.py -q
          python -m pytest --noconftest tests/test_catalog_object.py -q -k 'to_row_from_row or write_read_roundtrip or legacy_row'
          python -m pytest --noconftest tests/test_evaluation_run_selection.py -q
          python -m pytest --noconftest tests/test_psf_provenance.py::test_psf_resampling_preserves_stamp -q
          python -m pytest --noconftest tests/test_sky_lazy_imports.py -q
          python -m pytest --noconftest tests/test_measure_star_saturation.py -q
          python -m pytest --noconftest tests/test_spa_routes.py -q

  # The React console (euclid_polish/web/frontend) builds into the COMMITTED
  # euclid_polish/web/static/dist that Flask serves. This job type-checks,
  # lints and unit-tests the frontend, rebuilds it from the lockfile, and
  # fails when the committed build is stale (edited sources without a
  # rebuild, or a build that was never committed).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euclid_polish/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: euclid_polish/web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed build is fresh
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code --stat -- euclid_polish/web/static/dist; then
            echo "::error::euclid_polish/web/static/dist is stale: run 'npm run build' in euclid_polish/web/frontend and commit the result."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all -- euclid_polish/web/static/dist)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::the build produced files that are not committed under euclid_polish/web/static/dist."
            exit 1
          fi
