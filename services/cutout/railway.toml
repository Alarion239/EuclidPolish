# Railway service config. In the Railway service settings set
# Root Directory = services/cutout and the region to US East (Virginia),
# next to the S3 bucket (us-east-1).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
