# Railway service config. Deploy from this directory (`railway up`), or set
# Root Directory = services/cutout for git deploys. The region is US East
# (Virginia), next to the S3 bucket (us-east-1).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
