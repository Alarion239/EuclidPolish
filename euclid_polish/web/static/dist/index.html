    <!-- Apply the persisted theme before first paint (no flash). Default light. -->

      (function () {
        try {
          var t = localStorage.getItem("ep-theme");

            "data-theme", t === "dark" || t === "light" ? t : "light");
        } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
      })();
