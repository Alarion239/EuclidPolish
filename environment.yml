name: EuclidPolishEnv
channels:
  - conda-forge
dependencies:
  - python=3.12
  - tensorflow
  - numpy
  - pandas
  - tensorflow-probability
  - matplotlib
  - opencv
  - scipy
  - astropy
  - scikit-image
  # Fit-time only (colour+SFR forest calibration); generation stays NumPy.
  - scikit-learn
  - tf-keras
  - tqdm
  - astroquery
  - photutils=2.3.*
  - questionary
  - pytest
  # Test-only: tests/test_viewer_results.py reads the exported grid PDF.
  - pypdf
  - ruff
  - flask>=3.1       # app.config["TRUSTED_HOSTS"] (Host allowlist) needs Werkzeug/Flask 3.1
  - pexpect
  - pip
  - pip:
      - lenstronomy
