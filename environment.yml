name: EuclidPolishEnv
channels:
  - conda-forge
dependencies:
  - python=3.12
  - tensorflow
  - numpy
  - pandas
  - tensorflow-probability
  - matplotlib
  - opencv
  - scipy
  - astropy
  - scikit-image
  - tf-keras
  - tqdm
  - astroquery
  # FastEPSFBuilder subclasses the Photutils 2.3 ePSF implementation.
  # Photutils 3.0 refactored those internals; migrate with numerical parity tests.
  - photutils=2.3.*
  - questionary
  - pytest
  - ruff
  - flask
  - pexpect
  - pip
  - pip:
      - lenstronomy
