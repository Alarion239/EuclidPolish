# Isolated PyTorch environment for the LOCAL Zoobot morphology evaluation.
#
# Zoobot is PyTorch-based and would clash with the main EuclidPolishEnv
# (TensorFlow). Keep it in its OWN env — do NOT merge into environment.yml.
#
# Create it locally (the WebUI "Run Zoobot" button shells out to this env's
# Python; scripts/zoobot_morphology.py runs on your machine, device=auto picks
# Apple MPS / CUDA / CPU):
#
#   mamba env create -f environment-zoobot.yml      # → env "EuclidPolishZoobot"
#
# If the env lands somewhere the WebUI can't guess, point it at the interpreter:
#   export EUCLID_POLISH_ZOOBOT_PYTHON=$(conda run -n EuclidPolishZoobot which python)
name: EuclidPolishZoobot
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - astropy
  - pillow
  - pip:
      # zoobot pulls in torch, lightning, timm and galaxy-datasets (which
      # provides CatalogDataModule + the inference transforms the predict
      # helper expects). The default torch wheel is CPU/MPS — fine for the
      # handful-to-hundreds of galaxies a typical eval run has. On a CUDA box,
      # swap to "zoobot[pytorch-cu121]>=2.0" for the GPU build.
      - "zoobot[pytorch]>=2.0"
