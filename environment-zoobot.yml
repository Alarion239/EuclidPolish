# Isolated PyTorch environment for the Zoobot morphology evaluation.
#
# Zoobot is PyTorch-based and would clash with the main EuclidPolishEnv
# (TensorFlow). Keep it in its OWN env — do NOT merge into environment.yml.
#
# Create it ON FASRC, once (the `eval_zoobot_morphology` step activates it by
# name on a GPU node):
#
#   module load python
#   mamba env create -f environment-zoobot.yml         # → env "EuclidPolishZoobot"
#
# IMPORTANT — to actually use the FASRC GPU, install the CUDA torch build (the
# default "zoobot[pytorch]" below is a CPU wheel). After creating the env:
#
#   mamba run -n EuclidPolishZoobot pip install --force-reinstall \
#       "zoobot[pytorch-cu121]>=2.0"
#
# (or pin the index: pip install torch --index-url
#  https://download.pytorch.org/whl/cu121). On a CPU-only run, the default wheel
# is fine — just submit the step to a non-GPU partition.
name: EuclidPolishZoobot
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - astropy
  - pillow
  - pip:
      # zoobot pulls in torch, lightning, timm and galaxy-datasets (which
      # provides CatalogDataModule + the inference transforms the predict
      # helper expects). This is the CPU wheel; see the CUDA note above to use
      # the FASRC GPU.
      - "zoobot[pytorch]>=2.0"
