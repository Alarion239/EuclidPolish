# Project tooling config. (No build-system/project table — the package is run
# in-place from a conda env, not pip-installed.)

[tool.vulture]
# Dead-code scan. Confidence stays at the default 60 so genuinely-unused
# functions/methods (reported at 60%) still surface; the false positives that
# vulture can't see through — decorator-registered Flask routes, pytest
# fixtures, and framework-invoked callbacks — are suppressed below instead.
paths = ["euclid_polish", "scripts", "tests"]
min_confidence = 60
ignore_decorators = [
    # Flask route handlers + lifecycle hooks (registered, not called by name).
    "@app.route",
    "@*.route",
    "@*.errorhandler",
    "@*.before_request",
    "@*.after_request",
    "@*.context_processor",
    "@*.teardown_appcontext",
    # pytest fixtures (injected by name).
    "@pytest.fixture",
    "@_pytest.fixture",
]
ignore_names = [
    # Structural members invoked by a framework / the language, not by name.
    "_missing_",          # Enum lookup hook
    "PROV_FORMAT",        # Persistable protocol attribute
    "row_factory",        # sqlite3.Connection attribute
    "CLEAN", "CSV",       # Role / Format enum members (kept for completeness)
    # PyTorch Lightning / Keras module hooks.
    "on_train_epoch_end", "predict_step", "training_step", "validation_step",
    "configure_optimizers", "tqdm_hook",
    # JobRecord dataclass fields (written via record_post_mortem / serialised).
    "req_cpus", "req_gpus", "req_memory", "req_time_limit", "exit_code",
    "alloc_memory_mb", "gpu_util_mean", "gpu_util_peak", "cpu_util_mean",
    "cpu_util_peak",
    # pytest fixture params injected by name (used via side effects, not body).
    "experimental_lanes_on", "no_env", "cfg_path", "four_band_cutouts",
    "self_inner", "pl_module", "batch_idx", "dataloader_idx", "crval", "ctype",
]


# ---------------------------------------------------------------------------
# Ruff — linter + import sorter. Run: `ruff check .`  (auto-fix: `ruff check --fix .`)
# ---------------------------------------------------------------------------

[tool.ruff]
# 110, not 88: the codebase was authored to ~100-108; 110 is the house width.
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, B bugbear, UP pyupgrade,
# C4 comprehensions, SIM simplifications.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E741",   # ambiguous var names (l, O) — common for loop/index vars here
    "B008",   # function call in argument default (Config.* defaults are intentional)
    "UP042",  # str,Enum -> StrEnum changes str()/format() of Role/Format, which
              # resolve.py (f"{role}_...") and core.py (Role(str(role))) rely on
    "E701",   # compound `if x: y` — used deliberately for terse guards
    "E702",   # paired statements on one line (ax.set_xticks([]); set_yticks([]),
              # test setup a=...; b=...) read better together than split
    "SIM115", # open() without a context manager — the hits are a writer class
              # that owns the handle, a handle passed to Popen, and throwaway
              # open(p).read() in tests; none are context-manageable
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import inside functions (lazy heavy deps / isolation) and
# bind unused fixtures; don't flag those.
"tests/*" = ["E402", "F401", "F811", "E501"]   # E501: long fixture data lines
"__init__.py" = ["F401"]   # re-export modules
# Scripts set os.environ (BLAS thread caps) + sys.path BEFORE importing numpy /
# the package, so their imports are necessarily below that bootstrap.
"scripts/*" = ["E402"]


# ---------------------------------------------------------------------------
# Pyright — static type checker. Run: `pyright`
#
# "standard" (not "strict"): on a numpy/TF/astropy codebase strict is ~80%
# reportUnknown* noise from the untyped scientific stack. Standard keeps the
# real-bug detectors (possibly-unbound, optional-access, argument/return-type,
# unreachable code) and drops the Unknown-type flood.
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["euclid_polish"]
exclude = ["**/__pycache__", "**/node_modules"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
